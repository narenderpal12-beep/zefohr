kind = "web"
previewPath = "/"
title = "PeopleHub"
description = "Editable Indian HRMS marketing website with organisation registration, subscription portal, CMS and SEO management."
version = "1.0.0"
id = "artifacts/peoplehub"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 24316
[services.development]
run = "npm run dev --workspace=@workspace/peoplehub"
[services.production.build]
args = ["npm", "run", "build", "--workspace=@workspace/peoplehub"]
[services.production.build.env]
NODE_ENV = "production"
[services.production.run]
args = ["npm", "run", "start", "--workspace=@workspace/peoplehub"]
[services.production.run.env]
NODE_ENV = "production"
PORT = "24316"
[services.production.health.startup]
path = "/"
[services.env]
PORT = "24316"
BASE_PATH = "/"
